# =====================================================================
# NGINX MIME-TYPE & CACHE AYARLARI (jaayquick.com server bloğu için)
# =====================================================================
# Nginx'te .webmanifest uzantısının doğru Content-Type ile sunulması
# ve favicon dosyalarının tarayıcı önbelleğinde hızlı çalışması için:

location ~* ^/(favicon\.ico|favicon\.svg|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|maskable-icon-.*\.png|mstile-.*\.png|safari-pinned-tab\.svg|browserconfig\.xml)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
    log_not_found off;
}

location = /site.webmanifest {
    default_type application/manifest+json;
    expires 7d;
    add_header Cache-Control "public, no-transform";
    access_log off;
}
