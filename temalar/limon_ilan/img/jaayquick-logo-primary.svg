<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220">
  <defs>
    <style>
      .text-jaay { font-family: 'Montserrat', 'Ubuntu', 'Segoe UI', sans-serif; font-weight: 800; font-size: 82px; fill: #0B2545; }
      .text-uick { font-family: 'Montserrat', 'Ubuntu', 'Segoe UI', sans-serif; font-weight: 800; font-size: 82px; fill: #7BB31A; }
      .text-dotcom { font-family: 'Montserrat', 'Segoe UI', sans-serif; font-weight: 800; font-size: 32px; fill: #0B2545; }
      .text-slogan { font-family: 'Poppins', 'Inter', sans-serif; font-weight: 600; font-size: 20px; fill: #555555; letter-spacing: 0.5px; }
      .flag-red { fill: #DF1623; }
      .flag-white { fill: #FFFFFF; }
      .flag-blue { fill: #0047AB; }
      .flag-green { fill: #3A7D44; }
      .box-orange { fill: #F28C28; }
      .speed-line { stroke: #0B2545; stroke-width: 3.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Left Side: Decorative Gambia Bars -->
  <g transform="translate(25, 65)">
    <rect x="0" y="0" width="10" height="95" rx="5" class="flag-red" />
    <rect x="15" y="0" width="10" height="95" rx="5" class="flag-blue" />
    <rect x="30" y="0" width="10" height="95" rx="5" class="flag-green" />
  </g>

  <!-- Hand Holding Cargo Box (Delivery & Quick Trade) -->
  <g transform="translate(75, 45)">
    <!-- Package Box -->
    <rect x="30" y="15" width="85" height="60" rx="6" class="box-orange" />
    <!-- Box Lid -->
    <rect x="25" y="10" width="95" height="15" rx="3" fill="#D97415" />
    <!-- Flag Ribbons across Box -->
    <rect x="62" y="10" width="7" height="65" class="flag-red" />
    <rect x="69" y="10" width="7" height="65" class="flag-blue" />
    <rect x="76" y="10" width="7" height="65" class="flag-green" />

    <!-- Supporting Hand Shape -->
    <path d="M 0,70 C 20,70 35,62 50,62 L 80,62 C 95,62 105,70 115,75 C 95,85 75,98 50,98 L 20,98 C 5,98 0,85 0,70 Z" class="box-orange" />
    <!-- Sleeve / Cuff -->
    <rect x="-8" y="60" width="14" height="42" rx="4" class="flag-blue" />
  </g>

  <!-- Main Wordmark: jaay -->
  <text x="215" y="130" class="text-jaay">jaay</text>

  <!-- Pin-Styled "Q" Icon -->
  <g transform="translate(425, 65)">
    <!-- Pin outer body -->
    <path d="M 32,5 C 16,5 3,18 3,34 C 3,52 28,75 32,78 C 36,75 61,52 61,34 C 61,18 48,5 32,5 Z" class="flag-green" />
    <!-- Pin inner cutout (Bag handle / ring style) -->
    <circle cx="32" cy="30" r="14" fill="#FFFFFF" />
    <!-- Gambian mini flag badge inside pin -->
    <rect x="23" y="22" width="18" height="5" class="flag-red" />
    <rect x="23" y="27" width="18" height="5" class="flag-blue" />
    <rect x="23" y="32" width="18" height="5" class="flag-green" />
    <!-- Bag Handle -->
    <path d="M 24,10 C 24,2 40,2 40,10" fill="none" stroke="#3A7D44" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Main Wordmark: uick -->
  <text x="495" y="130" class="text-uick">uick</text>

  <!-- .com + Speed Lines -->
  <g transform="translate(685, 128)">
    <line x1="-18" y1="-12" x2="-3" y2="-12" class="speed-line" />
    <line x1="-24" y1="-4" x2="-5" y2="-4" class="speed-line" />
    <line x1="-16" y1="4" x2="-3" y2="4" class="speed-line" />
    <text x="2" y="2" class="text-dotcom">.com</text>
  </g>

  <!-- Subtitle / Slogan -->
  <text x="360" y="172" class="text-slogan">The Gambia's Fast Marketplace</text>
</svg>