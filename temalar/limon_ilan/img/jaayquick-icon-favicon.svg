<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <style>
      .flag-red { fill: #DF1623; }
      .flag-white { fill: #FFFFFF; }
      .flag-blue { fill: #0047AB; }
      .flag-green { fill: #3A7D44; }
      .box-orange { fill: #F28C28; }
    </style>
  </defs>
  <!-- Background rounded box -->
  <rect width="256" height="256" rx="54" fill="#0B2545" />

  <!-- Gambian Flag Arc Accent on Top -->
  <g transform="translate(48, 28)">
    <rect x="0" y="0" width="160" height="6" rx="3" class="flag-red" />
    <rect x="0" y="8" width="160" height="6" rx="3" class="flag-white" />
    <rect x="0" y="16" width="160" height="8" rx="4" class="flag-blue" />
    <rect x="0" y="26" width="160" height="6" rx="3" class="flag-white" />
    <rect x="0" y="34" width="160" height="6" rx="3" class="flag-green" />
  </g>

  <!-- Center Pin Shopping Bag -->
  <g transform="translate(76, 75)">
    <!-- Pin outer body -->
    <path d="M 52,10 C 26,10 5,32 5,58 C 5,90 46,132 52,138 C 58,132 99,90 99,58 C 99,32 78,10 52,10 Z" class="flag-green" />
    <!-- Inner Circle Cutout -->
    <circle cx="52" cy="54" r="24" fill="#FFFFFF" />
    <!-- Gambian mini flag badge inside pin -->
    <rect x="37" y="42" width="30" height="7" class="flag-red" />
    <rect x="37" y="50" width="30" height="8" class="flag-blue" />
    <rect x="37" y="59" width="30" height="7" class="flag-green" />
    <!-- Bag Handle -->
    <path d="M 38,18 C 38,4 66,4 66,18" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>